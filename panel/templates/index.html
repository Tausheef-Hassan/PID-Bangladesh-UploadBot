{% extends 'base.html' %}
{% block title %}Overview — pid-bot{% endblock %}
{% block content %}

  <div id="dashboard" hx-get="{{ url_for('partial_dashboard') }}"
       hx-trigger="every 5s" hx-swap="outerHTML">
    {% include '_dashboard.html' %}
  </div>

  <section class="card">
    <h2>Live log</h2>
    <p class="hint">The job's output, newest at the bottom. Refreshes every few seconds.</p>
    <div id="log" hx-get="{{ url_for('partial_log') }}"
         hx-trigger="every 3s" hx-swap="innerHTML">
      {% include '_log.html' %}
    </div>
  </section>

{% endblock %}
