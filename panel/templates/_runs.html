<div id="runs" hx-get="{{ url_for('partial_runs') }}"
     hx-trigger="every 30s" hx-swap="outerHTML">
  <h2>Recent runs</h2>
  <p class="hint">One bar per run, height by images uploaded. Only failures are coloured.</p>
  <div class="beat" role="img"
       aria-label="Images uploaded per run across the last {{ ticks|length }} runs">
    {% for t in ticks %}
      <span class="tick tick-{{ t.status }}" style="height:{{ t.height }}%" title="{{ t.label }}"></span>
    {% else %}
      <p class="empty">No runs recorded yet. The first one shows up here.</p>
    {% endfor %}
  </div>
  {% if ticks %}
    <div class="beat-caption"><span>{{ ticks|length }} runs ago</span><span>now</span></div>
  {% endif %}
</div>
